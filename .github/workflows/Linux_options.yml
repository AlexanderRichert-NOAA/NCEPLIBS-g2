# This is a GitHub actions workflow for NCEPLIBS-g2.
#
# This builds the develop branch different options.
#
# Ed Hartnett, 12/22/22
name: Linux_options
on:
  push:
    branches:
    - develop
  pull_request:
    branches:
    - develop
  schedule:
    # Run monthly
    - cron: '0 0 1 * *'
  workflow_dispatch:

# Cancel in-progress workflows when pushing to a branch
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  Linux_options:
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/noaa-emc/ci-common-build-cache/nceplibs-develop-ubuntu-24.04-gcc-14-mpich-x:latest
      volumes:
        - /usr:/usr
        - /etc:/etc
    env:
      FC: gfortran
      CC: gcc
      LD_LIBRARY_PATH: /home/runner/work/NCEPLIBS-g2/NCEPLIBS-g2/nceplibs/jasper/lib/
    strategy:
#      fail-fast: true
      matrix:
        bacio-version: [2.6.0]
        w3emc-version: [2.10.0, 2.11.0]
        config:
        - {
            options: "-DCMAKE_BUILD_TYPE=Debug"
          }
        - {
            options: '-DCMAKE_C_Fortran_FLAGS="-g" -DLOGGING=ON'
          }
        - {
            options: "-DBUILD_WITH_W3EMC=OFF"
          }

    steps:


    - name: checkout
      uses: actions/checkout@v4
      with:
        path: g2

    - name: cache-data
      id: cache-data
      uses: actions/cache@v4
      with:
        path: ~/data
        key: data-5

    - name: build
      run: |
        . /entrypoint.sh
        set -x
        cd g2
        mkdir build
        cd build
        cmake ${{ matrix.config.options }} -DFTP_TEST_FILES=ON -DTEST_FILE_DIR=/home/runner/data ..
        make -j2 VERBOSE=1

    - name: cache-data
      if: steps.cache-data.outputs.cache-hit != 'true'
      run: |
        mkdir ~/data
        cp $GITHUB_WORKSPACE/g2/build/tests/data/* ~/data

    - name: test
      run: |
        . /entrypoint.sh
        cd $GITHUB_WORKSPACE/g2/build
        ctest --verbose --rerun-failed --output-on-failure
